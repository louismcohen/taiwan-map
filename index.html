<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>East Coast Scooter Route · Taitung → Hualien</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
  <style>
    :root {
      --bg: #faf8f4;
      --ink: #1d1d1b;
      --muted: #6b6a66;
      --line: #e6e2da;
      --wed: #6d5bd0;
      --thu: #0f8b8d;
      --fri: #e07a1f;
      --sat: #d1495b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif; color: var(--ink); background: var(--bg); }
    body { display: flex; }
    #sidebar { width: 380px; flex-shrink: 0; height: 100%; overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg); }
    #map { flex: 1; height: 100%; }
    header { padding: 24px 22px 16px; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    #totals { margin-top: 10px; font-size: 13px; font-weight: 600; }
    .day { padding: 16px 22px 6px; }
    .day-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .day-head h2 { margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
    .day-head .stats { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .stop { display: flex; gap: 12px; padding: 10px 10px; margin: 0 -10px; border-radius: 10px; cursor: pointer; transition: background 0.15s; }
    .stop:hover, .stop.active { background: #efebe3; }
    .day-note { margin: -2px 0 8px; font-size: 12px; line-height: 1.45; color: var(--muted); }
    .badge { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
    .badge.suggested { background: #fff; color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
    .stop h3 { margin: 0 0 2px; font-size: 14px; line-height: 1.3; }
    .stop .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 3px; }
    .stop p { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
    .stay-block { margin: 8px 0 4px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .stay-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 2px; }
    .zone-swatch { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }
    .zone-swatch.primary { border-width: 2px; background: color-mix(in srgb, var(--c) 22%, transparent); }

    .marker { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid #fff; color: #fff; font: 700 13px/1 -apple-system, sans-serif; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.35); cursor: pointer; }
    .marker { background: var(--c); }
    .marker.stay { border-radius: 8px; }
    .marker.suggested { width: 24px; height: 24px; font-size: 11px; background: #fff; color: var(--c); border: 2.5px solid var(--c); box-shadow: 0 1px 4px rgba(0,0,0,0.25); }
    .mapboxgl-popup-content { border-radius: 12px; padding: 14px 16px; max-width: 280px; font-family: inherit; }
    .popup .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .popup h3 { margin: 0 0 6px; font-size: 15px; }
    .popup p { margin: 0 0 10px; font-size: 13px; line-height: 1.45; color: var(--muted); }
    .popup a { font-size: 13px; font-weight: 600; color: var(--ink); }

    @media (max-width: 760px) {
      body { flex-direction: column-reverse; }
      #sidebar { width: 100%; height: 45%; border-right: 0; border-top: 1px solid var(--line); }
      #map { height: 55%; flex: none; }
    }
  </style>
</head>
<body>
  <aside id="sidebar">
    <header>
      <h1>East Rift &amp; Coast by Scooter</h1>
      <p>Taitung → Hualien · Wed–Sat · outlined stops are suggested additions</p>
      <div id="totals">Calculating route…</div>
    </header>
    <div id="days"></div>
  </aside>
  <div id="map"></div>

  <script>
    mapboxgl.accessToken = 'pk.REDACTED_MAPBOX_TOKEN';

    const DAYS = {
      wed: { name: 'Wednesday', color: 'var(--wed)', hex: '#6d5bd0' },
      thu: { name: 'Thursday', color: 'var(--thu)', hex: '#0f8b8d',
        note: 'North along the coast on Hwy 11, then over the mountains on Hwy 23 into the rift valley.' },
      fri: { name: 'Friday', color: 'var(--fri)', hex: '#e07a1f',
        note: 'Yuchang Hwy 30 to the coast, up Hwy 11, then back inland on Hwy 11甲.' },
      sat: { name: 'Saturday', color: 'var(--sat)', hex: '#d1495b',
        note: 'Easy ride north up the rift valley to Hualien.' },
    };

    // Entries with `original` had coordinates several km from the real place; `original` keeps the supplied value.
    // `suggested` stops are additions to the original plan; `offRoute` stops are detours not included in the route line.
    const STOPS = [
      { day: 'wed', stay: true, lat: 22.7933, lng: 121.1234, name: 'Taitung Easy Stay Homestay (台東可可)', label: 'Stay idea · not booked',
        desc: 'Highly rated modern boutique homestay in Taitung City featuring pristine cleanliness and convenient scooter parking.' },

      { day: 'thu', suggested: true, lat: 22.8106, lng: 121.1947, name: 'Jialulan Coastal Park', query: '加路蘭遊憩區', label: 'Suggested · On the way',
        desc: 'Grassy clifftop park right on Hwy 11 with driftwood art installations and wide Pacific views. A good first stretch-your-legs stop out of Taitung.' },
      { day: 'thu', lat: 22.8775, lng: 121.2262, original: [22.8967, 121.2144], name: 'Dulan Sugar Factory Café and Art Gallery', query: '都蘭糖廠', label: 'Stop',
        desc: 'Historic industrial sugar mill turned vibrant coastal art community. Features local woodwork studios and craft cafes.' },
      { day: 'thu', lat: 22.9664, lng: 121.3045, name: 'Donghe Bun Shop', query: '東河包子', label: 'Snack',
        desc: 'Legendary roadside pitstop famous for fluffy steamed pork buns and sweet brown sugar buns. Grab a couple before heading inland on Hwy 23.' },
      { day: 'thu', lat: 23.1259, lng: 121.2193, original: [23.0519, 121.2183], name: 'Chishang Train Station (Bento Lunch)', query: '池上車站', label: 'Lunch',
        desc: "Traditional boxed rail lunches served in thin wooden boxes to commemorate Taiwan's finest rice." },
      { day: 'thu', lat: 23.0985, lng: 121.2105, original: [23.0531, 121.2217], name: 'Brown Boulevard (Mr. Brown Avenue)', query: '伯朗大道', label: 'Stop',
        desc: 'Massive expanse of rice fields completely free of utility lines. Features the famous Takeshi Kaneshiro Tree.' },
      { day: 'thu', suggested: true, lat: 23.3211, lng: 121.3107, name: 'Kecheng Iron Bridge (客城鐵橋)', query: '客城鐵橋', label: 'Suggested · On the way',
        desc: 'Historic steel truss bridge over the Xiuguluan River on the edge of Yuli, one of the most photographed spots in southern Hualien. A quick photo stop on the way into town for dinner.' },
      { day: 'thu', lat: 23.3333, lng: 121.3167, name: '馬蓋先美食玉里麵 (Yuli Noodles)', query: '馬蓋先美食玉里麵', label: 'Dinner',
        desc: 'Famous diner serving traditional oil-tossed Yuli dry noodles topped with aromatic shallot oil. About 10 minutes from Antong.' },
      { day: 'thu', stay: true, lat: 23.2956, lng: 121.3683, name: 'Antong Hot Spring Hotel', query: '安通溫泉飯店', label: 'Stay idea · not booked',
        desc: 'Relaxing hot spring hotel nestled in the mountains right off the scenic cross-mountain Yuchang Highway.' },

      { day: 'fri', suggested: true, lat: 23.1225, lng: 121.4120, name: 'Sanxiantai (Eight-Arch Bridge)', query: '三仙台', label: 'Suggested · Short backtrack',
        desc: 'Offshore volcanic islet linked by a wave-shaped eight-arch footbridge — one of the signature sights of the east coast. Adds about 30 km south from where Hwy 30 meets the coast.' },
      { day: 'fri', suggested: true, lat: 23.4006, lng: 121.4878, name: 'Baxian Cave (八仙洞)', query: '八仙洞', label: 'Suggested · On the way',
        desc: 'Sea caves carved into a cliff now lifted well above the waves; one of the oldest prehistoric sites in Taiwan. Right on Hwy 11.' },
      { day: 'fri', suggested: true, lat: 23.4655, lng: 121.5106, name: 'Changhong Bridge & Tropic of Cancer Marker', query: '長虹橋', label: 'Suggested · On the way',
        desc: 'Red arch bridge over the mouth of the Xiuguluan River, with the white Tropic of Cancer monument at Jingpu a minute up the road.' },
      { day: 'fri', lat: 23.4877, lng: 121.5108, original: [23.2783, 121.4931], name: 'Shi Ti Ping (Stone Steps)', query: '石梯坪', label: 'Stop',
        desc: 'Spectacular wave-cut volcanic marine terraces. Park and explore the massive stone staircase steps over the Pacific.' },
      { day: 'fri', lat: 23.6558, lng: 121.4239, name: 'Hualien Tourism Sugar Factory (Guangfu)', query: '花蓮觀光糖廠', label: 'Stop',
        desc: 'Retro Japanese colonial-era refinery. A perfect highway rest stop famous for fresh milk ice cream cones.' },

      { day: 'sat', suggested: true, lat: 23.6720, lng: 121.4250, name: 'Mataian Wetland (馬太鞍濕地)', query: '馬太鞍濕地', label: 'Suggested · On the way',
        desc: 'Amis farming wetland of fish ponds, lotus and streams next to Guangfu, with local Amis restaurants. Nice slow morning start.' },
      { day: 'sat', suggested: true, lat: 23.9233, lng: 121.5050, name: 'Liyu Lake (鯉魚潭)', query: '鯉魚潭', label: 'Suggested · Small detour',
        desc: "Hualien's largest inland lake, ringed by forested mountains. Flat lakeside loop; a few km off Hwy 9." },
      { day: 'sat', suggested: true, offRoute: true, lat: 24.0300, lng: 121.6260, name: 'Qixingtan Beach (七星潭)', query: '七星潭', label: 'Suggested · Optional detour',
        desc: 'Crescent pebble beach with the Central Mountains dropping to the sea. About 15 km round trip from the station if you have time before returning the scooter.' },
      { day: 'sat', final: true, lat: 23.9936, lng: 121.5997, name: 'Hualien Train Station', query: '花蓮車站', label: 'Final Destination',
        desc: 'Drop the scooter outside the station and catch an evening express train back to Taipei. Look for a 155cc+ rental that allows one-way drop-off here, and book train seats early — weekend trains to Taipei sell out.' },
    ];

    STOPS.forEach((s, i) => { s.n = i + 1; });

    // Each day's ride starts where the previous day ended.
    const ROUTE_STOPS = STOPS.filter((s) => !s.offRoute);
    const SEGMENTS = ['thu', 'fri', 'sat'].map((day) => {
      const firstIdx = ROUTE_STOPS.findIndex((s) => s.day === day);
      const lastIdx = ROUTE_STOPS.findLastIndex((s) => s.day === day);
      return { day, stops: ROUTE_STOPS.slice(firstIdx - 1, lastIdx + 1) };
    });

    // Areas to stay each night, drawn as soft zones rather than pins. `r` is the zone radius in km.
    const NIGHTS = {
      wed: [
        { name: 'Taitung City', lat: 22.7555, lng: 121.1495, r: 4.5, tag: 'Top pick',
          note: 'Most homestays and scooter rental shops on the trip, plus Tiehua Music Village and the night market downtown. Easiest place to start.' },
        { name: 'Dulan', lat: 22.8734, lng: 121.2276, r: 3, tag: 'Also good',
          note: 'Laid-back surf village 30 km up the coast with cafés and live music. Gives you a head start on Thursday.' },
      ],
      thu: [
        { name: 'Antong Hot Springs', lat: 23.2956, lng: 121.3683, r: 3, tag: 'Top pick',
          note: 'A soak after the longest riding day. Quiet, rural hot spring hotels a short ride from Yuli for dinner.' },
        { name: 'Yuli', lat: 23.3341, lng: 121.3147, r: 3, tag: 'Also good',
          note: 'Market town with the most food and lodging in this stretch of the valley. Walk to dinner, and Hwy 30 starts right here on Friday.' },
      ],
      fri: [
        { name: 'Guangfu / Mataian', lat: 23.6657, lng: 121.4236, r: 4.5, tag: 'Top pick',
          note: 'Friday ends here, so no extra riding. Amis-run homestays around the wetland, with the sugar factory next door.' },
        { name: 'Fenglin', lat: 23.7468, lng: 121.4509, r: 3.5, tag: 'Also good',
          note: 'Small Hakka "slow city" 10 km further north on Saturday\'s route, with more B&Bs and good Hakka food.' },
      ],
      sat: [],
    };
    const PRIMARY_TAGS = new Set(['Top pick']);
    const NIGHT_NAMES = { wed: 'Wednesday night', thu: 'Thursday night', fri: 'Friday night' };

    function circlePolygon(lng, lat, km, steps = 64) {
      const dLat = km / 110.574;
      const dLng = km / (111.32 * Math.cos((lat * Math.PI) / 180));
      const ring = [];
      for (let i = 0; i <= steps; i++) {
        const a = (2 * Math.PI * i) / steps;
        ring.push([lng + dLng * Math.cos(a), lat + dLat * Math.sin(a)]);
      }
      return { type: 'Polygon', coordinates: [ring] };
    }

    const esc = (str) => str.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const gmapsUrl = (s) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.query || s.name)}`;
    const fmtKm = (m) => `${(m / 1000).toFixed(0)} km`;
    const fmtTime = (sec) => {
      const h = Math.floor(sec / 3600);
      const m = Math.round((sec % 3600) / 60);
      return h ? `${h}h ${m}m` : `${m}m`;
    };

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/outdoors-v12',
      bounds: new mapboxgl.LngLatBounds(...boundsOf(STOPS)),
      fitBoundsOptions: { padding: 60 },
    });
    map.addControl(new mapboxgl.NavigationControl(), 'top-right');
    map.addControl(new mapboxgl.ScaleControl({ unit: 'metric' }), 'bottom-right');

    function boundsOf(stops) {
      const lngs = stops.map((s) => s.lng);
      const lats = stops.map((s) => s.lat);
      return [[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]];
    }

    // Sidebar
    const daysEl = document.getElementById('days');
    const items = new Map();
    for (const [key, day] of Object.entries(DAYS)) {
      const section = document.createElement('section');
      section.className = 'day';
      section.innerHTML = `
        <div class="day-head">
          <h2 style="color:${day.color}">${day.name}</h2>
          <span class="stats" id="stats-${key}"></span>
        </div>
        ${day.note ? `<p class="day-note">${esc(day.note)}</p>` : ''}`;
      for (const s of STOPS.filter((st) => st.day === key)) {
        const el = document.createElement('div');
        el.className = 'stop';
        el.innerHTML = `
          <div class="badge${s.suggested ? ' suggested' : ''}" style="--c:${day.color}">${s.n}</div>
          <div>
            <div class="label">${esc(s.label)}</div>
            <h3>${esc(s.name)}</h3>
            <p>${esc(s.desc)}</p>
          </div>`;
        el.addEventListener('click', () => focusStop(s));
        section.appendChild(el);
        items.set(s, el);
      }

      const stay = document.createElement('div');
      stay.className = 'stay-block';
      if (NIGHTS[key].length) {
        stay.innerHTML = `<div class="stay-head">Where to stay · ${NIGHT_NAMES[key]}</div>`;
        for (const t of NIGHTS[key]) {
          const row = document.createElement('div');
          row.className = 'stop town';
          row.innerHTML = `
            <div class="zone-swatch${PRIMARY_TAGS.has(t.tag) ? ' primary' : ''}" style="--c:${day.hex}"></div>
            <div>
              <div class="label">${esc(t.tag)}</div>
              <h3>${esc(t.name)}</h3>
              <p>${esc(t.note)}</p>
            </div>`;
          row.addEventListener('click', () => focusTown(t, key));
          stay.appendChild(row);
        }
      } else {
        stay.innerHTML = '<div class="stay-head">No overnight · evening train to Taipei</div>';
      }
      section.appendChild(stay);
      daysEl.appendChild(section);
    }

    // Markers
    const popups = new Map();
    for (const s of STOPS) {
      const day = DAYS[s.day];
      const el = document.createElement('div');
      el.className = 'marker' + (s.stay || s.final ? ' stay' : '') + (s.suggested ? ' suggested' : '');
      el.style.setProperty('--c', day.hex);
      el.textContent = s.n;

      const popup = new mapboxgl.Popup({ offset: 18, closeButton: false }).setHTML(`
        <div class="popup">
          <div class="label" style="color:${day.hex}">${day.name} · ${esc(s.label)}</div>
          <h3>${esc(s.name)}</h3>
          <p>${esc(s.desc)}</p>
          <a href="${gmapsUrl(s)}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
        </div>`);
      popup.on('open', () => setActive(s));

      new mapboxgl.Marker({ element: el }).setLngLat([s.lng, s.lat]).setPopup(popup).addTo(map);
      popups.set(s, popup);
    }

    function setActive(stop) {
      for (const [s, el] of items) el.classList.toggle('active', s === stop);
      items.get(stop).scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function focusStop(s) {
      for (const p of popups.values()) p.remove();
      townPopup.remove();
      map.flyTo({ center: [s.lng, s.lat], zoom: 13, essential: true });
      popups.get(s).setLngLat([s.lng, s.lat]).addTo(map);
    }

    // Stay zones
    const townPopup = new mapboxgl.Popup({ closeButton: false, maxWidth: '280px' });

    function showTownPopup(t, dayKey, lngLat) {
      const day = DAYS[dayKey];
      townPopup.setLngLat(lngLat).setHTML(`
        <div class="popup">
          <div class="label" style="color:${day.hex}">${NIGHT_NAMES[dayKey]} · ${esc(t.tag)}</div>
          <h3>${esc(t.name)}</h3>
          <p>${esc(t.note)}</p>
        </div>`).addTo(map);
    }

    function focusTown(t, dayKey) {
      for (const p of popups.values()) p.remove();
      map.flyTo({ center: [t.lng, t.lat], zoom: 12, essential: true });
      showTownPopup(t, dayKey, [t.lng, t.lat]);
    }

    function addStayZones() {
      const towns = Object.entries(NIGHTS).flatMap(([dayKey, list]) => list.map((t) => ({ t, dayKey })));
      const props = ({ t, dayKey }, i) => ({ i, name: t.name, color: DAYS[dayKey].hex, primary: PRIMARY_TAGS.has(t.tag) });

      map.addSource('stay-zones', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: towns.map((x, i) => ({
          type: 'Feature', properties: props(x, i), geometry: circlePolygon(x.t.lng, x.t.lat, x.t.r),
        })) },
      });
      map.addSource('stay-labels', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: towns.map((x, i) => ({
          type: 'Feature',
          properties: { ...props(x, i), label: `${x.t.name}\n${NIGHT_NAMES[x.dayKey].replace(' night', '')} · ${x.t.tag.toLowerCase()}` },
          geometry: { type: 'Point', coordinates: [x.t.lng, x.t.lat - x.t.r / 110.574] },
        })) },
      });

      map.addLayer({
        id: 'stay-fill', type: 'fill', source: 'stay-zones',
        paint: { 'fill-color': ['get', 'color'], 'fill-opacity': ['case', ['get', 'primary'], 0.28, 0.14] },
      });
      map.addLayer({
        id: 'stay-outline', type: 'line', source: 'stay-zones',
        paint: {
          'line-color': ['get', 'color'],
          'line-width': 1.5,
          'line-dasharray': [2, 2],
          'line-opacity': ['case', ['get', 'primary'], 0.9, 0.55],
        },
      });
      map.addLayer({
        id: 'stay-label', type: 'symbol', source: 'stay-labels', minzoom: 9,
        layout: {
          'text-field': ['get', 'label'],
          'text-font': ['DIN Pro Medium', 'Arial Unicode MS Regular'],
          'text-size': ['interpolate', ['linear'], ['zoom'], 7, 10, 12, 13],
          'text-anchor': 'top',
          'text-offset': [0, 0.3],
          'text-line-height': 1.15,
          'text-allow-overlap': false,
        },
        paint: { 'text-color': ['get', 'color'], 'text-halo-color': '#ffffff', 'text-halo-width': 1.5 },
      });

      map.on('click', 'stay-fill', (e) => {
        const { t, dayKey } = towns[e.features[0].properties.i];
        showTownPopup(t, dayKey, e.lngLat);
      });
      map.on('mouseenter', 'stay-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'stay-fill', () => { map.getCanvas().style.cursor = ''; });
    }

    // Routes
    const FLOW_PERIOD = 15000;
    const FLOW_PULSES = 3;
    const FLOW_TAIL = 0.1;
    const FLOW_ALPHA = 0.5;

    // Comet-shaped highlights travelling from start (line-progress 0) to end (1); fade-in tail, crisp head.
    // Heads run past 1 by the tail length so each pulse slides fully off the end before wrapping.
    function flowGradient(t) {
      const stops = [];
      for (let i = 0; i < FLOW_PULSES; i++) {
        const head = ((t + i / FLOW_PULSES) % 1) * (1 + FLOW_TAIL);
        const tail = head - FLOW_TAIL;
        const alphaAt = (p) => (FLOW_ALPHA * (p - tail)) / FLOW_TAIL;
        const start = Math.max(tail, 0);
        const end = Math.min(head, 1);
        if (start >= end) continue;
        stops.push([start, alphaAt(start)], [end, alphaAt(end)]);
        if (head + 0.002 < 1) stops.push([head + 0.002, 0]);
      }
      stops.sort((a, b) => a[0] - b[0]);
      if (!stops.length || stops[0][0] > 0) stops.unshift([0, 0]);
      if (stops[stops.length - 1][0] < 1) stops.push([1, 0]);

      const expr = ['interpolate', ['linear'], ['line-progress']];
      let prev = -1;
      for (const [p, a] of stops) {
        if (p <= prev) continue;
        expr.push(p, `rgba(255,255,255,${a.toFixed(3)})`);
        prev = p;
      }
      return expr;
    }

    async function fetchRoute(seg) {
      const coords = seg.stops.map((s) => `${s.lng},${s.lat}`).join(';');
      const url = `https://api.mapbox.com/directions/v5/mapbox/driving/${coords}?geometries=geojson&overview=full&access_token=${mapboxgl.accessToken}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        const route = data.routes?.[0];
        if (!route) throw new Error(data.message || 'No route');
        return { geometry: route.geometry, distance: route.distance, duration: route.duration };
      } catch (err) {
        console.warn(`Directions failed for ${seg.day}, drawing straight lines`, err);
        return { geometry: { type: 'LineString', coordinates: seg.stops.map((s) => [s.lng, s.lat]) } };
      }
    }

    map.on('load', async () => {
      addStayZones();
      const results = await Promise.all(SEGMENTS.map(fetchRoute));

      const features = results.map((r, i) => ({
        type: 'Feature',
        properties: { color: DAYS[SEGMENTS[i].day].hex },
        geometry: r.geometry,
      }));

      map.addSource('route', { type: 'geojson', lineMetrics: true, data: { type: 'FeatureCollection', features } });
      map.addLayer({
        id: 'route-casing', type: 'line', source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#ffffff', 'line-width': 8, 'line-opacity': 0.9 },
      });
      map.addLayer({
        id: 'route-line', type: 'line', source: 'route',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': ['get', 'color'], 'line-width': 4.5 },
      });

      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        map.addLayer({
          id: 'route-flow', type: 'line', source: 'route',
          layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-width': 2.5, 'line-gradient': flowGradient(0) },
        });
        const tick = (now) => {
          map.setPaintProperty('route-flow', 'line-gradient', flowGradient((now % FLOW_PERIOD) / FLOW_PERIOD));
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      let totalDist = 0, totalDur = 0, complete = true;
      results.forEach((r, i) => {
        const el = document.getElementById(`stats-${SEGMENTS[i].day}`);
        if (r.distance == null) { complete = false; el.textContent = 'route unavailable'; return; }
        totalDist += r.distance;
        totalDur += r.duration;
        el.textContent = `${fmtKm(r.distance)} · ${fmtTime(r.duration)}`;
      });
      document.getElementById('totals').textContent = complete
        ? `${fmtKm(totalDist)} total · ~${fmtTime(totalDur)} riding`
        : 'Some segments could not be routed';
    });
  </script>
</body>
</html>
