name: Sync saved places

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-places
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # The script only uses built-in fetch, so there is nothing to install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull the Google Maps list
        run: node scripts/sync-places.ts
        env:
          # Optional: without it, new places are classified by name and note only.
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/places.ts; then
            echo "No changes to the list."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git add src/data/places.ts
          git commit -m 'chore(places): sync saved Google Maps list'
          git push origin HEAD:main
